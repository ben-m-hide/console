pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{js,jsx,ts,tsx,json,css}'
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: '*.{ts,tsx}'
      run: bun run typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
