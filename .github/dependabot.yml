version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
        # Exactly-pinned packages get their own individual PR — that's the
        # whole point of pinning them (see CONTRIBUTING.md's Dependency
        # pinning policy): a nursery-tier Biome rule change, or a large new
        # dependency surface with no `bun audit` allowlist, should land as
        # its own reviewable diff, not bundled into an unrelated weekly PR.
        exclude-patterns:
          - "@biomejs/biome"
          - "aws-cdk"
          - "aws-cdk-lib"
          - "constructs"
          - "@playwright/test"
          - "drizzle-kit"
      production-dependencies:
        dependency-type: "production"
        exclude-patterns:
          - "hono"
          - "@hono/zod-openapi"
          - "@scalar/hono-api-reference"
          - "drizzle-orm"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
