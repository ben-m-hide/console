name: Test Coverage

on:
  pull_request:

concurrency:
  group: test-coverage-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - run: bun install --frozen-lockfile

      # codegen writes apps/web/src/routeTree.gen.ts and packages/shared's
      # schema files, both gitignored — packages/shared's tests fail without
      # this (see typecheck's own bun run codegen && ... pattern).
      - run: bun run codegen

      # Each package runs independently (not the chained root test:coverage
      # script) with continue-on-error, so one package's test failure doesn't
      # block the others' coverage-summary.json from being generated — every
      # package should still get a report below.
      - run: bun run --filter ./apps/web test:coverage
        continue-on-error: true

      - run: bun run --filter ./apps/api test:coverage
        continue-on-error: true

      - run: bun run --filter ./apps/ingestion test:coverage
        continue-on-error: true

      - run: bun run --filter ./packages/shared test:coverage
        continue-on-error: true

      # apps/ingestion's ingest-*.ts orchestrators (DB/HTTP I/O) are
      # deliberately untested here and verified manually against real data
      # instead — see apps/ingestion/.claude/CLAUDE.md. Low coverage on those
      # specific files is expected, not a gap to close.
      - name: "Report apps/web Coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          name: "apps/web"
          json-summary-path: "./apps/web/coverage/coverage-summary.json"
          json-final-path: "./apps/web/coverage/coverage-final.json"

      - name: "Report apps/api Coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          name: "apps/api"
          json-summary-path: "./apps/api/coverage/coverage-summary.json"
          json-final-path: "./apps/api/coverage/coverage-final.json"

      - name: "Report apps/ingestion Coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          name: "apps/ingestion"
          json-summary-path: "./apps/ingestion/coverage/coverage-summary.json"
          json-final-path: "./apps/ingestion/coverage/coverage-final.json"

      - name: "Report packages/shared Coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          name: "packages/shared"
          json-summary-path: "./packages/shared/coverage/coverage-summary.json"
          json-final-path: "./packages/shared/coverage/coverage-final.json"
